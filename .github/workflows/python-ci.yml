name: Python CI

on: push

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    # The base image determines the Python (3.14) and geospatial stack
    # (GDAL 3.12.2, numpy 2.x) we test against. It ships a prebuilt virtualenv
    # at /opt/venv; we install our dependencies on top of it.
    container: pcic/geospatial-python:3.12.2
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      HOME: /root
      POETRY_HOME: /opt/poetry
      POETRY_VIRTUALENVS_CREATE: "false"
      VIRTUAL_ENV: /opt/venv

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -yq --no-install-recommends \
            build-essential python3-dev python3-venv git \
            libpq-dev libxml2-dev libxslt1-dev libffi-dev

      - name: Install poetry
        run: |
          python3 -m venv "$POETRY_HOME"
          "$POETRY_HOME/bin/pip" install --no-cache-dir "poetry==2.4.0"
          # Entries added to GITHUB_PATH are prepended, so the last write wins:
          # keep /opt/venv/bin ahead of poetry's venv on PATH.
          echo "$POETRY_HOME/bin" >> $GITHUB_PATH
          echo "/opt/venv/bin" >> $GITHUB_PATH

      - name: Install python dependencies
        run: |
          poetry install --extras dev

      - name: Test with pytest (full)
        if: github.ref == 'refs/heads/master'
        run: |
          py.test -m "not online" -v

      - name: Test with pytest (fast)
        if: github.ref != 'refs/heads/master'
        run: |
          py.test -m "not online and not slow" -v
