[project]
name = "ce"
version = "3.8.0"
requires-python = ">=3.11,<4"
description = "PCIC's Climate Explorer (CE)"
authors = [
    {name = "Pacific Climate Impacts Consortium"},
    {name = "Rod Glover", email = "rglover@uvic.ca"},
    {name = "James Hiebert", email = "hiebert@uvic.ca"},
    {name = "Nik Rados"},
    {name = "Lee Zeman", email = "lzeman@uvic.ca"},
    {name = "Jonathan Helfrich"},
    {name = "Ada Sungar"},
    {name = "Cairo Sanders"},
    {name = "Quintin Sparks", email = "quintins@uvic.ca"},
    {name = "Basil Veerman"},
    {name = "Eric Yvorchuk"},
]
license = "GPL-3.0-only"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
keywords = [
    "sql",
    "api",
    "database",
    "climate",
]
dependencies = [
    "Flask>=3.1.1,<4",
    "Flask-SQLAlchemy>=3.0.5,<4",
    "Flask-Cors>=4.0.0,<5",
    "shapely>2.0,<3",
    "numpy>=2,<3",
    # GDAL is provided by the pcic/geospatial-python base image; the Python
    # bindings must match the system libgdal exactly. Keep this pin in sync
    # with the geospatial-python image tag used in the Dockerfiles.
    "GDAL==3.12.2",
    "rasterio>=1.4,<2",
    "SQLAlchemy>=2.0.40,<3.0.0",
    "contexttimer==0.3.3",
    "Pint<1",
    "gunicorn==23.0.0",
    "nchelpers @ git+https://github.com/pacificclimate/nchelpers.git@py-sprint-25q1",
    "modelmeta (==2.0.1)",
    "cf-cell-methods==0.1.0",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=3.0.0",
    "python-dateutil>=2.8.2,<3.0.0",
    "black>=23.11.0,<24.0.0",
    "pre-commit>=3.5.0,<4.0.0",
]
docs = [
    "sphinx>=8.2.3,<9.0.0",
    "sphinx-pyproject>=0.3.0,<0.4.0",
    "m2r2>=0.3.4,<0.4.0",
    "poethepoet>=0.34.0,<0.35.0",
]

[[tool.poetry.source]]
name = "pcic"
url = "https://pypi.pacificclimate.org/simple"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "online: marks tests that use an online resource (deselect with '-m \"not online\"')",
    "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
]
norecursedirs = ".git .venv .cache site-packages _build *.egg ce/tests/helpers"

[tool.black]
target-version = ["py311", "py312", "py313", "py314"]

[tool.poe.tasks]
document = "sphinx-build doc/source doc/build/html"
pdf = "make latexpdf -C doc"

[solver]
min-release-age = 7